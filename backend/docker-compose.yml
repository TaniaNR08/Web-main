services:
  mysql:
    image: mysql:8.0
    container_name: schoolweb_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 170522iris.
      MYSQL_DATABASE: auth_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./extras/microservices_init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p170522iris."]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
