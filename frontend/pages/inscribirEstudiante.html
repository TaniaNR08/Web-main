<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscribir Estudiante</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="/src/pages/inscribirEstudiante.ts"></script>
</head>
<body class="min-h-screen bg-cover bg-center bg-no-repeat"
      style="background-image: url('https://cdn.rt.emap.com/wp-content/uploads/sites/4/2025/06/06173651/1-Godolphin-and-Latymer-School-OCo-dining-library-and-sixth-form_Jim-Stephensoncrop-748x499.webp')">

    <div class="fixed inset-0 bg-black/50 backdrop-blur-sm z-0"></div>

    <div class="relative z-10 pt-20 pb-10 px-4">
        <div class="max-w-md mx-auto">

            <div class="bg-white/90 backdrop-blur rounded-2xl shadow-xl p-6">
                <h2 class="text-lg font-semibold text-gray-800 mb-4 pb-2 border-b border-gray-200">Inscribir Estudiante al Grupo</h2>
                <form id="inscribirEstudianteForm" class="flex flex-col gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium text-gray-600" for="estudiante_id">Numero de Identificacion del Estudiante</label>
                        <input type="text" id="estudiante_id" name="estudiante_id" required placeholder="Ej: 1019987036"
                            class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-black transition">
                    </div>
                    <div class="pt-1">
                        <button type="submit"
                            class="w-full bg-black text-white py-2.5 rounded-lg text-sm font-medium hover:bg-gray-800 transition">
                            Inscribir Estudiante
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>


</body>
</html>
