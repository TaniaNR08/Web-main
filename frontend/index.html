<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-bg"></div>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <img src="/assets/img/logo.png" alt="Logo San Francisco de Asis">
                </div>
                <h1>San Francisco de Asís</h1>
                <p>Plataforma de Gestión Escolar</p>
            </div>
            <form id="formulario">
                <div class="field-group">
                    <label for="user">Usuario</label>
                    <div class="field-wrapper">
                        <i class="fa-solid fa-user field-icon"></i>
                        <input type="text" id="user" name="user" placeholder="Ingresa tu usuario" required>
                    </div>
                </div>
                <div class="field-group">
                    <label for="passwd">Contraseña</label>
                    <div class="field-wrapper">
                        <i class="fa-solid fa-lock field-icon"></i>
                        <input type="password" id="passwd" name="passwd" placeholder="Ingresa tu contraseña" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="login-btn">
                    Ingresar
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>
            <p id="feedbackText"></p>
        </div>
    </div>
    <script type="module" src="/src/pages/login.ts"></script>
</body>
</html>
